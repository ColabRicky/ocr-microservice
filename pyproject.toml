[project]
name = "ocr-microservice"
version = "0.1.0"
description = "FastAPI microservice for PaddleOCR using official paddleocr package"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
